[workspace]
members = [
    "crates/piperine-abi",
    "crates/piperine-analog-solver",
    "crates/piperine-api",
    "crates/piperine-cli",
    "crates/piperine-device-fixtures",
    "crates/piperine-digital-solver",
    "crates/piperine-interp",
    "crates/piperine-ir",
    "crates/piperine-ir-fixtures",
    "crates/piperine-lang-fixtures",
    "crates/piperine-lang",
    "crates/piperine-project",
    "crates/piperine-repository-guards",
    "crates/piperine-numbers",
    "crates/piperine-parity",
    "crates/piperine-plan",
    "crates/piperine-solver",
    "crates/piperine-transpile",
]

default-members = [".", "crates/piperine-abi", "crates/piperine-analog-solver", "crates/piperine-api", "crates/piperine-cli", "crates/piperine-device-fixtures", "crates/piperine-digital-solver", "crates/piperine-interp", "crates/piperine-ir", "crates/piperine-ir-fixtures", "crates/piperine-lang", "crates/piperine-lang-fixtures", "crates/piperine-numbers", "crates/piperine-parity", "crates/piperine-plan", "crates/piperine-project", "crates/piperine-repository-guards", "crates/piperine-solver", "crates/piperine-transpile"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[package]
name = "piperine"
version.workspace = true
edition.workspace = true

[dependencies]
piperine-api = { path = "crates/piperine-api" }

# The tests of record stay on this crate importing `piperine::…` — they are
# the proof the shell re-exports the full host surface.
[dev-dependencies]
# The suites also reach lang directly (SourceMap setup) — dev-only edges, not part of the shell's public story.
piperine-lang = { path = "crates/piperine-lang" }
piperine-solver = { path = "crates/piperine-solver" }
piperine-transpile = { path = "crates/piperine-transpile" }
# The scenarios (`tests/scenarios.rs`) read each twin's command with the binary's own parser and the
# corpus layout of the parity harness, and hold the table `piperine::` gives to ngspice.
piperine-cli = { path = "crates/piperine-cli" }
piperine-parity = { path = "crates/piperine-parity" }
# The integrated target (`tests/integrated/`) validates the shape of each compiled body.
piperine-ir = { path = "crates/piperine-ir" }
piperine-plan = { path = "crates/piperine-plan" }
piperine-abi = { path = "crates/piperine-abi" }
tempfile = { workspace = true }
num-complex = { workspace = true }

# `workspace_shape` keeps every .rs out of the root `tests/` and `src/`, so the one root host target
# (HII-24) lives beside the api tests it mirrors, in a subdirectory the api crate does not discover.
[[test]]
name = "host_ii"
path = "crates/piperine-api/tests/root_surface/host_ii.rs"

# The Book (`feature root-e2e`): one target, one module per chapter, and the two guards over the Book's text
# (`inventory_guard`, `claims_guard`) beside them, with the support modules the chapters share.
[[test]]
name = "book"
path = "tests/book/main.rs"

# A dev/test build of this workspace links ~50 test binaries, and full
# debuginfo is what makes that expensive: every `rust-lld` invocation peaked
# at ~1.1 GB and several run in parallel, so a one-crate change relinking the
# suite drove the machine into swap. Line tables keep what a failing test
# actually needs — file and line in every panic and backtrace — and drop only
# variable inspection under a debugger. Override locally (`.cargo/config.toml`
# or `CARGO_PROFILE_DEV_DEBUG=2`) when stepping through code in gdb/lldb.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.faer]
opt-level = 3

# The solver's hot path in a dev or test build: a mixed transient of the buck took 784 s
# unoptimized. Rust has no fast-math, so an optimized float is the same float: results are
# bit-identical, only faster. The generated design code is already built at -C opt-level=2.
[profile.dev.package.piperine-solver]
opt-level = 2

[profile.dev.package.piperine-analog-solver]
opt-level = 2

[profile.dev.package.piperine-digital-solver]
opt-level = 2

[profile.dev.package.piperine-abi]
opt-level = 2

# The numeric crate's tests check every f16 input and millions of operand pairs against exact
# big-integer arithmetic: unoptimized they take minutes. Optimization changes no result (integer
# and correctly rounded float arithmetic), and overflow checks stay on in a dev build.
# The guards crate parses every source of the repository with `syn` in each test run; unoptimized
# that is 10 s, optimized it is a second. Results are the same.
[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3

[profile.dev.package.piperine-numbers]
opt-level = 3

[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

[profile.dev.package.num-traits]
opt-level = 3

[profile.release]
debug = true
opt-level = 3
lto = "fat"
codegen-units = 1


[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
num-complex = "0.4"
num-traits = "0.2"
faer = { version = "0.23.2", features = ["sparse", "std", "sparse-linalg"] }
ndarray = { version = "0.17.1", features = ["rayon"] }
bimap = "0.6.3"
rayon = "1.11.0"
rand_distr = "0.5.1"
paste = "1.0.15"
libloading = "0.8"
tempfile = "3"
inventory = "0.3"

[workspace.lints.clippy]
# ── Deny: mechanical, no reason to ignore ──
collapsible_if                  = "deny"
doc_overindented_list_items     = "deny"
excessive_precision             = "deny"
io_other_error                  = "deny"
manual_div_ceil                 = "deny"
manual_is_multiple_of           = "deny"
needless_borrow                 = "deny"
needless_range_loop             = "deny"
ptr_arg                         = "deny"
redundant_closure               = "deny"
slow_vector_initialization      = "deny"
unnecessary_cast                = "deny"
unnecessary_map_or              = "deny"
# ── Warn ──
question_mark                   = "warn"
# ── Allow ──
module_inception                = "allow"
new_without_default             = "allow"
too_many_arguments              = "allow"
type_complexity                 = "allow"
large_enum_variant              = "allow"
mutable_key_type                = "allow"

# Runs by name, not by `cargo test` (MD-77; registered in `suite_hygiene.rs`).
[[test]]
name = "buck_scenarios"
path = "tests/buck_scenarios.rs"
test = false

[[test]]
name = "book_buck"
path = "tests/book/buck.rs"
test = false

[[test]]
name = "integrated"
path = "tests/integrated/main.rs"
