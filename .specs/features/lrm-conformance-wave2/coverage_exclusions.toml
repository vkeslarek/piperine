reason = "Scope of SPICE compatibility: states an implementation supporting it must read SPICE netlists containing models/subcircuits (E.1.2) — the netlist-reader mechanism spec.md excludes."
spec_row = "A raw SPICE netlist (`.subckt`/`.model`) reader"

