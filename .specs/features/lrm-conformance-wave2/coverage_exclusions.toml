# T69: out_of_scope rows for Annex E (SPICE compatibility). Annex E's
# remaining uncovered sections (after E.3.4 $limit()/E.4.1 $mfactor, both
# implemented and covered elsewhere) are all about the SPICE-*netlist*
# profile — accessing bare `.model`/`.subckt` primitives without a
# Verilog-AMS declaration, binning/library files, and primitive-vs-module
# name-scoping precedence against SPICE primitives that only exist when a
# netlist reader resolves them. Piperine's SPICE path is header-based (`.va`
# models you `` `include``, never implicit bare primitives from a netlist),
# so these sections map to spec.md's "A raw SPICE netlist (`.subckt`/
# `.model`) reader" Out of Scope row.

[[out_of_scope]]
