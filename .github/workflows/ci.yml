name: CI

# Manual only: the account's Actions minutes go to the docs build (docs.yml).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ngspice (the parity tests compare against it)
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Build Workspace
        run: cargo build

      - name: Run Tests
        run: cargo test
