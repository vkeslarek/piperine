[package]
name = "piperine-parity"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
piperine-abi = { path = "../piperine-abi" }
piperine-plan = { path = "../piperine-plan" }
piperine-lang = { path = "../piperine-lang" }
piperine-interp = { path = "../piperine-interp" }
piperine-ir = { path = "../piperine-ir" }
piperine-transpile = { path = "../piperine-transpile" }
piperine-api = { path = "../piperine-api" }
piperine-solver = { path = "../piperine-solver" }
tempfile.workspace = true

[dev-dependencies]
piperine-ir-fixtures = { path = "../piperine-ir-fixtures" }
piperine-numbers-fixtures = { path = "../piperine-numbers-fixtures" }
piperine-numbers = { path = "../piperine-numbers" }
num-bigint = "0.4"

# The buck's targets run by name, not by `cargo test` (MD-77; registered in `suite_hygiene.rs`).

[[test]]
name = "buck_whole"
path = "tests/buck_whole.rs"
test = false

[[test]]
name = "buck_dpwm"
path = "tests/buck_dpwm.rs"
test = false

[[test]]
name = "buck_control"
path = "tests/buck_control.rs"
test = false

[[test]]
name = "buck_boundary"
path = "tests/buck_boundary.rs"
test = false

[[test]]
name = "buck_power"
path = "tests/buck_power.rs"
test = false

[[test]]
name = "buck_supervisor"
path = "tests/buck_supervisor.rs"
test = false

[[test]]
name = "buck_closed_loop"
path = "tests/buck_closed_loop.rs"
test = false
