[package]
name = "piperine-plugin"
version.workspace = true
edition.workspace = true
description = "Piperine plugin SDK + host: manifest, TOFU trust, native backend, device factories"

[dependencies]
piperine-lang = { path = "../piperine-lang" }
piperine-codegen = { path = "../piperine-codegen" }
piperine-solver = { path = "../piperine-solver" }
piperine-project = { path = "../piperine-project" }
piperine = { path = "../.." }
thiserror.workspace = true
miette = { version = "7", features = ["fancy"] }
serde.workspace = true
toml = "1.1.2"
sha2 = "0.10"
libloading.workspace = true
inventory.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The fixture declares its devices via `#[pip::device]` — the crate is
# aliased `pip` so the attribute spells exactly like the Python decorator.
pip = { package = "piperine-plugin-macros", path = "../piperine-plugin-macros" }

# The fixture plugin (an analog resistor + a digital inverter) lives as an
# example: `cargo build --example fixture_plugin` produces the cdylib the
# native smoke test dlopens; the e2e tests compile the same source in-process
# via `#[path]`.
[[example]]
name = "fixture_plugin"
crate-type = ["cdylib", "rlib"]
