[package]
name = "piperine-cli"
version.workspace = true
edition.workspace = true

# The `piperine` binary lives here (MD-19): the root crate is lib-only.
[[bin]]
name = "piperine"
path = "src/main.rs"

[dependencies]
# The builder interface only: no derive (AGENTS.md rule 5, no macros).
clap = { version = "4.6.1", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
piperine-api = { path = "../piperine-api" }
piperine-lang = { path = "../piperine-lang" }
piperine-transpile = { path = "../piperine-transpile" }

[dev-dependencies]
# The twins' corpus layout (`Corpus`), read by the twins target.
piperine-parity = { path = "../piperine-parity" }
tempfile.workspace = true

# Runs by name, not by `cargo test` (MD-77; registered in `suite_hygiene.rs`).
[[test]]
name = "buck"
path = "tests/buck.rs"
test = false

[[test]]
name = "book_buck"
path = "tests/book_buck.rs"
test = false
