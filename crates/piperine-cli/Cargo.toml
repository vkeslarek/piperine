[package]
name = "piperine-cli"
version.workspace = true
edition.workspace = true

# The `piperine` binary lives here (MD-19): the root crate is lib-only.
[[bin]]
name = "piperine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
piperine-lang = { path = "../piperine-lang" }
piperine-project = { path = "../piperine-project" }
include_dir = "0.7.4"
thiserror.workspace = true
toml_edit = "0.25.12"
miette = "7.6.0"

[dev-dependencies]
tempfile.workspace = true
