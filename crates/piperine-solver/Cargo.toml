[package]
name = "piperine-solver"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
num-complex.workspace = true
num-traits.workspace = true
faer.workspace = true
rand_distr.workspace = true
ndarray.workspace = true
bimap.workspace = true
log = "0.4"
rayon.workspace = true
bitflags = "2.6"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Dev-only edges (MD-28): the analysis-level suites drive real PHDL devices, so
# they elaborate with `piperine-lang` and JIT with `piperine-codegen`. The solver
# itself depends on neither — this is a dev-dependency cycle cargo resolves
# separately from the normal graph.
piperine-lang = { path = "../piperine-lang" }
piperine-codegen = { path = "../piperine-codegen" }
