[package]
name = "piperine-lang"
version.workspace = true
edition.workspace = true

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
# `stacker` is declared on purpose: MSL's 256-level nesting bound fits an 8 MiB
# debug stack because chumsky grows the stack in heap segments past a red zone
# (`Recursive` parsers). Dropping it would overflow on deeply nested sources.
chumsky = { version = "=0.13.0", default-features = false, features = ["std", "stacker", "pratt"] }
logos = "=0.16.1"

stacker = "0.1.25"
serde.workspace = true
# The elaborator (`elab`) writes the Piperine IR; the IR crate is a leaf, so the edge adds nothing
# to the front end it sits behind.
piperine-ir = { path = "../piperine-ir" }
# `Design::from_json` reads the serialized form.
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
# `elab_values` holds the integer folding of `ConstEval` against the compiled code's own integers
# (`rt::{UInt, Int}`): one rule, two implementations, compared.
piperine-transpile = { path = "../piperine-transpile" }
