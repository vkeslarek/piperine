site_name: Piperine
site_description: Piperine mixed-signal language specification

# === [ SPECIFICATION VERSION ] ===
# Change this field when the language specification evolves.
# Independent of the Rust simulator codebase version.
extra:
  spec_version: "0.4.0"
# ===================================
theme:
  name: material

plugins:
  - search
  - macros
  - with-pdf:
      output_path: pdf/piperine-spec.pdf
      cover_title: "Piperine Mixed-Signal Language"
      cover_subtitle: "Complete Specification"
      cover_version: "v0.4.0" # Update here as well to reflect on the PDF cover

nav:
  - Specification:
    - Overview: spec/index.md
    - "I. Values": spec/part_i_values.md
    - "II. Carriers": spec/part_ii_carriers.md
    - "III. Structure": spec/part_iii_structure.md
    - "IV. Behavior": spec/part_iv_behavior.md
    - "V. Execution": spec/part_v_execution.md
    - "VI. Input and output": spec/part_vi_io.md
    - "VII. Standard library": spec/part_vii_stdlib.md
    - "VIII. The host": spec/part_viii_host.md
    - "A. Lexical structure": spec/appendix_a_lexical.md
    - "B. Grammar and reference": spec/appendix_b_grammar.md
    - "C. Implementation": spec/appendix_c_implementation.md
    - "D. Gallery: analog": spec/appendix_d_gallery_analog.md
    - "E. Gallery: digital": spec/appendix_e_gallery_digital.md
    - "F. Gallery: mixed-signal": spec/appendix_f_gallery_mixed.md
    - "G. Scope and open questions": spec/appendix_g_scope.md
